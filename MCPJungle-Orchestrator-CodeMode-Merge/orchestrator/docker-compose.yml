services:
  orchestrator:
    build: .
    ports:
      - "${ORCH_HOST_PORT:-8080}:8080"
    environment:
      - JUNGLE_URL=http://jungle:9000
      - BIND=0.0.0.0
    depends_on:
      jungle:
        condition: service_healthy

  jungle:
    image: mcpjungle/mcpjungle:latest-stdio
    environment:
      - SERVER_MODE=development
      - PORT=9000
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


