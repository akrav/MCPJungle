name: CI
on:
  push:
    branches: [ "Epic_1_mcp_orchestrator_pass_through" ]
  pull_request:
    branches: [ "Epic_1_mcp_orchestrator_pass_through" ]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: orchestrator/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test --silent

  image:
    if: github.ref == 'refs/heads/Epic_1_mcp_orchestrator_pass_through'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: orchestrator
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mcpjungle-orchestrator:sha-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mcpjungle-orchestrator:staging
          cache-from: type=gha
          cache-to: type=gha,mode=max

  obs-integration:
    if: github.ref == 'refs/heads/Epic_1_mcp_orchestrator_pass_through'
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orchestrator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: orchestrator/package-lock.json
      - name: Install with optional OTEL deps
        run: npm ci --include=optional
      - name: Run OTEL vendor smoke
        env:
          OTEL_ENABLE_VENDOR: 'true'
          OTEL_EXPORTER_OTLP_ENDPOINT: 'http://localhost:4318'
        run: npm test --silent -- tests/sprint4/otel_span_assert.spec.ts
