services:
  jungle:
    image: mcpjungle/mcpjungle:latest-stdio
    ports:
      - "9001:9000"
    environment:
      - SERVER_MODE=development
      - PORT=9000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extra_hosts:
      - "host.docker.internal:host-gateway"


