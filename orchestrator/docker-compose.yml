version: '3.9'
services:
  orchestrator:
    build: .
    ports:
      - "8080:8080"
    environment:
      - JUNGLE_URL=http://jungle:9000
    depends_on:
      jungle:
        condition: service_healthy

  jungle:
    image: mcpjungle/mcpjungle:latest-stdio
    environment:
      - SERVER_MODE=development
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

profiles:
  jungle:


