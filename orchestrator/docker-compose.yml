services:
  orchestrator:
    build: .
    ports:
      - "${ORCH_HOST_PORT:-8080}:8080"
    environment:
      - JUNGLE_URL=http://jungle:9000
      - BIND=0.0.0.0
      - CODEMODE_ENABLED=${CODEMODE_ENABLED:-false}
      - CODEMODE_ENABLE_LLM=${CODEMODE_ENABLE_LLM:-true}
      - CODEMODE_MAX_EXEC_MS=${CODEMODE_MAX_EXEC_MS:-10000}
      - CODEMODE_MAX_MEM_MB=${CODEMODE_MAX_MEM_MB:-128}
    depends_on:
      jungle:
        condition: service_healthy

  jungle:
    image: mcpjungle/mcpjungle:latest-stdio
    environment:
      - SERVER_MODE=development
      - PORT=9000
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s


